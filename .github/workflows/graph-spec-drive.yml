# Autonomous graph: Spec Drive node. Catalog entry -> spec PR (contract, acceptance criteria, E2E tests).
# The Odin node checks the PR and merges it.
name: graph-spec-drive
run-name: 'spec-drive ${{ inputs.req }}'

on:
  workflow_dispatch:
    inputs:
      req:
        description: Catalog id (R-NNNN)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: graph-spec-drive-${{ inputs.req }}
  cancel-in-progress: false

jobs:
  spec-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REQ: ${{ inputs.req }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: bash .github/graph/nodes.sh spec-drive guard
      - name: Spec Drive
        if: steps.guard.outputs.go == 'true'
        timeout-minutes: 75
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Spec Drive node of this repo's autonomous graph.
            Catalog entry: specs/requirements/${{ inputs.req }}.md (requirement issue #${{ steps.guard.outputs.src }}) in ${{ github.repository }}.
            Read .github/graph/spec-drive.md and follow it exactly.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Bash(gh:*),Bash(rustfmt:*),Bash(cargo fmt:*),Bash(cargo clippy:*),Read,Write,Edit,Glob,Grep"
      - name: Open the spec PR
        if: steps.guard.outputs.go == 'true'
        env:
          HASH: ${{ steps.guard.outputs.hash }}
          SRC: ${{ steps.guard.outputs.src }}
        run: bash .github/graph/nodes.sh spec-drive finish
      - name: Record cost
        if: always() && steps.guard.outputs.go == 'true'
        run: bash .github/graph/ledger.sh record spec-drive "${{ steps.guard.outputs.src }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.go == 'true'
        with:
          name: spec-drive-${{ inputs.req }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-runs/
          if-no-files-found: ignore
      - name: Wake the router
        if: always()
        run: gh workflow run graph-router.yml --repo "$REPO"
