# Autonomous graph: router (specs/README.md, "노드와 흐름").
# Reads the ledger and labels and dispatches every node that has work. Nodes never call each other;
# each wakes the router when it changed the ledger. Logic lives in .github/graph/*.sh.
name: graph-router

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: graph-router
  cancel-in-progress: false

jobs:
  # A human answered an Open Question (a comment that is not a marker, or removing `needs-decision`):
  # resume only that branch. Tickets go back to Dev; everything else is picked up by the router
  # because its ledger state still asks for work.
  answer:
    if: >-
      (github.event_name == 'issue_comment' && !endsWith(github.actor, '[bot]') && github.actor != 'github-actions' &&
       !startsWith(github.event.comment.body, '<!--') && contains(github.event.issue.labels.*.name, 'needs-decision')) ||
      ((github.event_name == 'issues' || github.event_name == 'pull_request') && github.event.action == 'unlabeled' &&
       github.event.label.name == 'needs-decision' && !endsWith(github.actor, '[bot]') && github.actor != 'github-actions')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Resume the branch
        run: |
          . .github/graph/lib.sh
          remove_label "$N" needs-decision
          comment_text "$N" "<!-- open-question-answered --> 답을 받아 이 갈래를 다시 돌린다(답한 사람: ${{ github.actor }})."
          l=$(labels "$N")
          case "$l" in *,model:opus,*|*,model:sonnet,*)
            case "$l" in *,ready-for-agent,*|*,in-progress,*|*,needs-verify,*|*,verifying,*) ;;
              *) remove_label "$N" spec-defect; add_label "$N" ready-for-agent;; esac;;
          esac

  route:
    needs: answer
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/graph/router.sh
